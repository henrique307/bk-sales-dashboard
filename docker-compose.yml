services:
  backend:
    build: ./backend
    ports:
      - "3333:3333"
    environment:
      PORT: 3333
      SEED_DATA: ${SEED_DATA:-true}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3333/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy